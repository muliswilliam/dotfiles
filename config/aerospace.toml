start-at-login = true

# Laptop alone: accordion (one full window visible). G9 connected: tiles.
exec-on-workspace-change = ['/bin/bash', '-c', 'if [ "$(/opt/homebrew/bin/aerospace list-monitors --count)" = 1 ]; then /opt/homebrew/bin/aerospace layout h_accordion; else /opt/homebrew/bin/aerospace layout h_tiles; fi']

[gaps]
inner.horizontal = 4
inner.vertical = 4
outer.top = 4
outer.bottom = 4
outer.left = 4
outer.right = 4

[mode.main.binding]

# Layout
ctrl-slash = 'layout tiles horizontal vertical'
ctrl-comma = 'layout accordion horizontal vertical'

# Focus
ctrl-h = 'focus left'
ctrl-j = 'focus down'
ctrl-k = 'focus up'
ctrl-l = 'focus right'

# Move
ctrl-shift-h = 'move left'
ctrl-shift-j = 'move down'
ctrl-shift-k = 'move up'
ctrl-shift-l = 'move right'

# Resize
ctrl-shift-minus = 'resize smart -50'
ctrl-shift-equal = 'resize smart +50'

# Workspaces (cmd + number, omarchy muscle memory)
cmd-1 = 'workspace 1'
cmd-2 = 'workspace 2'
cmd-3 = 'workspace 3'
cmd-4 = 'workspace 4'
cmd-5 = 'workspace 5'
cmd-6 = 'workspace 6'
cmd-7 = 'workspace 7'
cmd-8 = 'workspace 8'
cmd-9 = 'workspace 9'
cmd-0 = 'workspace 0'

# Move to workspace
cmd-shift-1 = 'move-node-to-workspace 1'
cmd-shift-2 = 'move-node-to-workspace 2'
cmd-shift-3 = 'move-node-to-workspace 3'
cmd-shift-4 = 'move-node-to-workspace 4'
cmd-shift-5 = 'move-node-to-workspace 5'
cmd-shift-6 = 'move-node-to-workspace 6'
cmd-shift-7 = 'move-node-to-workspace 7'
cmd-shift-8 = 'move-node-to-workspace 8'
cmd-shift-9 = 'move-node-to-workspace 9'
cmd-shift-0 = 'move-node-to-workspace 0'

# Workspace back and forth
ctrl-tab = 'workspace-back-and-forth'
ctrl-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# Service mode
ctrl-shift-semicolon = 'mode service'

# Workspaces ordered by how often they are used
[[on-window-detected]]
if.app-id = 'app.zen-browser.zen'
run = "move-node-to-workspace 1"

[[on-window-detected]]
if.app-id = 'com.github.wez.wezterm'
run = "move-node-to-workspace 2"

[[on-window-detected]]
if.app-id = 'com.microsoft.VSCode'
run = "move-node-to-workspace 3"

[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = "move-node-to-workspace 4"

[[on-window-detected]]
if.app-id = 'com.electron.wispr-flow'
run = "move-node-to-workspace 4"

[[on-window-detected]]
if.app-id = 'com.microsoft.teams2'
run = "move-node-to-workspace 5"

[[on-window-detected]]
if.app-id = 'com.microsoft.Outlook'
run = "move-node-to-workspace 6"

[[on-window-detected]]
if.app-id = 'notion.id'
run = "move-node-to-workspace 7"

[[on-window-detected]]
if.app-id = 'com.tinyapp.TablePlus'
run = "move-node-to-workspace 8"

[[on-window-detected]]
if.app-id = 'org.whispersystems.signal-desktop'
run = "move-node-to-workspace 9"

[[on-window-detected]]
if.app-id = 'com.spotify.client'
run = "move-node-to-workspace 9"

[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = "move-node-to-workspace 0"
