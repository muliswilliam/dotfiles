# herdr configuration - terminal workspace manager for AI coding agents.
# Full reference: `herdr --default-config` or https://herdr.dev/docs/configuration/
# Reload after editing: `herdr server reload-config`
#
# Used standalone in WezTerm (not nested in tmux) - one workspace per project
# directory, each running an agent (usually Claude) directly in its pane.

[keys]
# AeroSpace (config/aerospace.toml) binds bare ctrl+<letter|number> globally
# for workspace switching, so those combos never reach any terminal pane -
# herdr's default "ctrl+b" prefix would be dead on arrival. ctrl+a is free at
# the OS level and is already tmux's prefix (tmux.conf), so this keeps the
# same muscle memory regardless of which multiplexer owns the focused pane.
prefix = "ctrl+a"

# Toggle the sidebar. Already herdr's default binding, but pinned explicitly
# here since it's now "ctrl+a, b" instead of "ctrl+b, b".
toggle_sidebar = "prefix+b"

[ui]
# Distinct glyphs per state (blocked/working/done/idle) instead of color dots -
# easier to scan at a glance across several parallel agent panes.
status_indicators = "symbols"

# Panes are rarely renamed manually here (one agent per project workspace), so
# label borders with the detected agent instead.
show_agent_labels_on_pane_borders = true

[ui.sidebar.spaces]
# Branch name dropped to keep the row short - git_status alone still flags a
# dirty working tree without spelling out the branch every time.
rows = [
  ["state_icon", "workspace"],
  ["git_status"],
]

[ui.sidebar.agents.rows_by_agent]
# Surface what Claude is actually doing (its terminal title), not just that a
# Claude process is running in the pane.
claude = [
  ["state_icon", "workspace", "tab"],
  ["terminal_title_stripped"],
  ["agent"],
]

[ui.toast]
# Route through the outer terminal (WezTerm) instead of Herdr's own toasts or
# a raw OS notification - same delivery path in spirit as tmux's alert-bell
# hook (scripts/tmux-bell-notify.sh), and it still works over `herdr --remote`.
delivery = "terminal"

[experimental]
# Preserve pane scrollback across full server restarts, mirroring
# tmux-resurrect's @resurrect-capture-pane-contents in tmux.conf.
pane_history = true

[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
width = "80%"
height = "80%"
