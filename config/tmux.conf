set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB" # truecolor passthrough for WezTerm (the status bar below is all 24-bit hex)

set -g prefix C-a
unbind C-b
bind-key C-a send-prefix


# -c "#{pane_current_path}": without it, split-window/new-window use the session
# working directory (the dir the session was created in), not the current pane's,
# so a split from ~/projects/foo would open in the session dir instead.
unbind %
bind | split-window -h -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

bind c new-window -c "#{pane_current_path}"

bind r source-file ~/.tmux.conf

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5


bind -r m resize-pane -Z

set -g set-clipboard on
set -g mouse on
set -g status-position top

# Agent-attention notifications: forward BEL from any window/pane (not just
# the active one) to the outer terminal, and flag that window in the status
# bar, so WezTerm can react even when you're looking at a different tmux
# window/session.
set -g bell-action any
set -g monitor-bell on
set -g visual-bell off

# === Theme: Synthwave Everything ===
# https://cmuxthemes.com/themes/synthwave-everything/
#
# Hand-rolled rather than pulled in as a theme plugin: the hexes below are the
# same ones config/wezterm.lua sets, so terminal and multiplexer are guaranteed
# to match, and there's no plugin release to break the status bar.
#
#   bg       #241b2f   one shade under the terminal's #2a2139
#   muted    #848bbd   Synthwave '84's comment colour, for everything inactive
#   pink     #f92aad   session name
#   cyan     #36f9f6   active window
#   mint     #72f1b8   prefix-pressed indicator
#   orange   #f88414   bell flag -- an agent wants you
#   lavender #e1acff   clock
#
# Round powerline caps (U+E0B6 / U+E0B4) come from MesloLGS Nerd Font, which
# config/wezterm.lua already sets as the font.

# --- Reset the styles a theme plugin would have owned -------------------------
# These are set explicitly, not left to tmux's defaults, because a theme plugin
# sets them on the live server and removing the plugin does NOT unset them --
# they linger until the server restarts. Found on this machine after dropping
# tmux-kanagawa/tmux-themepack: window-style was still Kanagawa's #363646,
# window-status-current-style was still fg=black,bg=red, and the two section
# styles were still bg=black.
#
# window-style is the load-bearing one: it paints each pane's content area, so
# leaving it set overrides the terminal's own background and the palette in
# config/wezterm.lua never shows through. `default` lets WezTerm's #2a2139 win.
set -g window-style default
set -g window-active-style default
# The section styles matter because `#[default]` inside the format strings below
# pops back to them -- a stale bg=black would show as a dark gap after each pill.
set -g status-left-style default
set -g status-right-style default
setw -g window-status-style default
setw -g window-status-current-style default
# Bell and activity emphasis is handled inline in window-status-format below (the
# orange "!"), so keep tmux's own reverse-video treatment out of the way.
setw -g window-status-bell-style default
setw -g window-status-activity-style default
# -----------------------------------------------------------------------------

set -g status-style "bg=#241b2f,fg=#848bbd"
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 60

set -g status-left "#[fg=#f92aad]#[bg=#f92aad,fg=#241b2f,bold] #S #[bg=#241b2f,fg=#f92aad]#[default] "

# Inactive windows stay muted so the eye lands on the active pill first. The
# bell flag is checked per-window here (not left to window-status-bell-style) so
# it shows as a bright orange "!" next to the name even on an inactive window --
# that's the whole point of `bell-action any` above.
setw -g window-status-format "#[fg=#848bbd] #I #W#{?window_bell_flag,#[fg=#f88414#,bold] !,}#[default] "
setw -g window-status-current-format "#[fg=#36f9f6]#[bg=#36f9f6,fg=#241b2f,bold] #I #W#{?window_zoomed_flag, Z,} #[bg=#241b2f,fg=#36f9f6]#[default] "
setw -g window-status-separator ""

# Live feedback that C-a landed -- removes the "did my prefix register?" pause.
set -g status-right "#{?client_prefix,#[fg=#72f1b8]#[bg=#72f1b8#,fg=#241b2f#,bold] ^A #[bg=#241b2f#,fg=#72f1b8]#[default] ,}#[fg=#e1acff]#[bg=#e1acff,fg=#241b2f,bold] %d/%m/%Y %H:%M #[default]"

set -g pane-border-style "fg=#3f3357"
set -g pane-active-border-style "fg=#f92aad"
set -g display-panes-colour "#848bbd"
set -g display-panes-active-colour "#72f1b8"

set -g message-style "bg=#f92aad,fg=#241b2f,bold"
set -g message-command-style "bg=#72f1b8,fg=#241b2f,bold"
setw -g clock-mode-colour "#36f9f6"
setw -g clock-mode-style 24 # 24h, to match the status clock's %H:%M
setw -g mode-style "bg=#463465,fg=#f0eff1" # copy-mode selection, matched to wezterm's selection_bg

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode after dragging with mouse


# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# list of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator' # for navigating panes and vim/nvim with Ctrl-hjkl
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes
set -g @plugin 'tmux-plugins/tmux-yank' # copy to system clipboard from copy-mode

# No theme plugin: the Synthwave Everything status bar above is set directly.
# (tmux-kanagawa and jimeh/tmux-themepack were removed -- a theme plugin would
# overwrite those status-* settings when it loads.)
set -g @resurrect-capture-pane-contents 'on' # allow tmux-ressurect to capture pane contents
set -g @continuum-restore 'on' # enable tmux-continuum functionality

set -s escape-time 0
set -g history-limit 50000

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
# $HOME, not ~: tmux's run-shell does not reliably tilde-expand this path,
# which silently breaks plugin auto-init on a fresh server (confirmed via
# testing - the tpm script works fine invoked directly, but not via '~' here).
run-shell "$HOME/.tmux/plugins/tpm/tpm"
