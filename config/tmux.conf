set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB" # truecolor passthrough for WezTerm (needed for Kanagawa, nvim, etc.)

set -g prefix C-a
unbind C-b
bind-key C-a send-prefix


unbind %
bind | split-window -h

unbind '"'
bind - split-window -v

bind r source-file ~/.tmux.conf

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5


bind -r m resize-pane -Z

set -g set-clipboard on
set -g mouse on
set -g status-position top

# Agent-attention notifications: forward BEL from any window/pane (not just
# the active one) to the outer terminal, and flag that window in the status
# bar, so WezTerm can react even when you're looking at a different tmux
# window/session.
set -g bell-action any
set -g monitor-bell on
set -g visual-bell off
set -g @kanagawa-plugins "time" # just the clock -- no hostname/battery/network/weather segments
set -g @kanagawa-time-format '%d/%m/%Y %H:%M' # dd/mm/yyyy, 24h clock
set -g @kanagawa-show-flags true # show tmux's "!" bell flag on windows waiting for attention

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode after dragging with mouse


# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# list of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator' # for navigating panes and vim/nvim with Ctrl-hjkl
set -g @plugin 'jimeh/tmux-themepack' # to configure tmux theme
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes
set -g @plugin 'tmux-plugins/tmux-yank' # copy to system clipboard from copy-mode

# set -g @themepack 'powerline/default/cyan' # use this theme for tmux
set -g @plugin 'Nybkox/tmux-kanagawa'
set -g @resurrect-capture-pane-contents 'on' # allow tmux-ressurect to capture pane contents
set -g @continuum-restore 'on' # enable tmux-continuum functionality

set -s escape-time 0
set -g history-limit 50000

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
# $HOME, not ~: tmux's run-shell does not reliably tilde-expand this path,
# which silently breaks plugin auto-init on a fresh server (confirmed via
# testing - the tpm script works fine invoked directly, but not via '~' here).
run-shell "$HOME/.tmux/plugins/tpm/tpm"
